<!doctype html>
<html>
    <head>
        <title>Louis Tomlinson</title>
        <link rel="stylesheet" href="main.css">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barrio&family=Honk:MORF,SHLN@24,30.8&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Lexend+Tera:wght@100..900&family=Libre+Barcode+128&display=swap" rel="stylesheet">
    </head>

    <body>
<div>
  <h1 class="debut">Concert Coming Soon!!</h1>
  <p class="date">July 7th, 2026</p>
  <br>
<p id="countdown"></p>
</div>
<br><br><br>
<a href="https://louis-tomlinson.com/"><img class="louis" src="louis_tourposter.png"></a>

    </body>

<script>
// Set the date we're counting down to
var countDownDate = new Date("July 7, 2026 07:30:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();
    
  // Find the distance between now and the count down date
  var distance = countDownDate - now;
    
  // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
  // Output the result in an element with id="demo"
  document.getElementById("countdown").innerHTML = days + "d " + hours + "h "
  + minutes + "m " + seconds + "s ";
    
  // If the count down is over, write some text 
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "EXPIRED";
  }
}, 1000);
</script>



 
   
         


</html>
